plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' }
    }
    maven {
        url = 'https://maven.terraformersmc.com/releases'
        content { includeGroup 'dev.emi' }
    }
    maven {
        url = 'https://maven.ryanhcode.dev/releases'
        content { includeGroupByRegex 'dev\\.ryanhcode.*' }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        visualCheck {
            client()
            systemProperty 'witchsatelier.visualcheck', project.findProperty('shots') ?: 'all'
            systemProperty 'witchsatelier.fxoff', project.findProperty('fxoff') ?: ''
            programArguments.addAll '--quickPlaySingleplayer', project.findProperty('world') ?: 'WitchcraftVisualTest'
            programArguments.addAll '--width', '1920', '--height', '1200'
        }

        smokeServer {
            server()
            gameDirectory = project.file('run-smoke')
            programArgument '--nogui'
            systemProperty 'witchsatelier.smoke', '1'
        }
        smokeClient {
            client()
            gameDirectory = project.file('run-smoke-client')
            systemProperty 'witchsatelier.smoke', '1'
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25570', '--username', 'SmokeTester', '--width', '1280', '--height', '800'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly('dev.ryanhcode.sable:sable-common-1.21.1:2.0.6') { transitive = false }
    compileOnly('dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:1.6.0') { transitive = false }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    compileOnly "mezz.jei:jei-1.21.1-common-api:19.70.0.469"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.70.0.469"
    compileOnly "dev.emi:emi-neoforge:1.1.24+1.21.1:api"

}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    if (project.hasProperty('drawings')) systemProperty 'witchsatelier.drawings', project.property('drawings')
    if (project.hasProperty('ranks')) systemProperty 'witchsatelier.ranks', 'true'
    testLogging {
        events 'failed'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
}

tasks.named('jar', Jar) {
    exclude 'com/fimkov/witchsatelier/client/dev/**'
    exclude 'com/fimkov/witchsatelier/dev/**'
    exclude 'com/fimkov/witchsatelier/compat/SableFilm*'
}

if (project.hasProperty('jei')) {
    dependencies {
        localRuntime "mezz.jei:jei-1.21.1-neoforge:19.70.0.469"
    }
}
