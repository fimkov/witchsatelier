modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="logo.png"
description='''
Draw your own spells. Magic inspired by drawn-glyph witchcraft: a sigil in the centre, signs around it,
and nothing happens until you close the ring.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: with Sable installed, levitation glyphs and wind lift and push physics ships (Create Aeronautics)
[[dependencies.${mod_id}]]
    modId="sable"
    type="optional"
    versionRange="[2.0,)"
    ordering="AFTER"
    side="BOTH"

# the starfall dimension (beyond the Void Basin) must not mark worlds "experimental"
[[mixins]]
config="${mod_id}.mixins.json"
